ext {
    modId = 'instanceddimensions'
    modName = 'Instanced Dimensions'
    modGroupId = 'dev.yourname.instanceddimensions'
    modDescription = 'Runtime-instanced dimension engine for Forge with real ServerLevel lifecycle, sync, and travel.'
}

apply from: rootProject.file('gradle/forge-module.gradle')

configurations {
    devRuntimeMods
}

def c2mefCoordinate = "curse.maven:concurrent-chunk-management-engine-for-forge-the-${rootProject.c2mef_project_id}:${rootProject.c2mef_file_id}"
def c2mefDeobfEnabled = providers.gradleProperty('withC2mefDeobf')
    .orElse(providers.gradleProperty('withC2mef'))
    .map { it.toBoolean() }
    .orElse(false)
def c2mefRawEnabled = providers.gradleProperty('withC2mefRaw').map { it.toBoolean() }.orElse(false)

dependencies {
    devRuntimeMods c2mefCoordinate

    if (c2mefDeobfEnabled.get()) {
        runtimeOnly fg.deobf(c2mefCoordinate)
    }
}

def c2mefTargetJar = rootProject.file("run/mods/${rootProject.c2mef_version_name}")

tasks.register('syncDevRuntimeMods') {
    inputs.files(configurations.devRuntimeMods)
    inputs.property('withC2mefRaw', c2mefRawEnabled)
    outputs.file(c2mefTargetJar)

    doLast {
        if (c2mefRawEnabled.get()) {
            copy {
                from(configurations.devRuntimeMods)
                into(c2mefTargetJar.parentFile)
                rename { rootProject.c2mef_version_name }
            }
            return
        }

        delete(c2mefTargetJar)
    }
}

gradle.projectsEvaluated {
    minecraft.runs.configureEach {
        property 'forge.enabledGameTestNamespaces', 'instanceddimensions,obelisks'
        mods {
            obelisks {
                source project(':obelisks').sourceSets.main
            }
        }
    }
}

tasks.matching { it.name.startsWith('prepareRun') }.configureEach {
    dependsOn(':obelisks:classes')
    dependsOn(tasks.named('syncDevRuntimeMods'))
    if (project(':obelisks').file('src/gameteststructures').exists()) {
        dependsOn(':obelisks:syncGameTestStructures')
    }
}
