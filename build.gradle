plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
    id 'org.jetbrains.kotlin.jvm' version '1.9.24' apply false
}

ext {
    modId = 'obelisks'
    modName = 'Dimensional Scar Expeditions'
    modGroupId = 'dev.yourname.obelisks'
    modDescription = 'Meteoric rift anchors open real-dimension expeditions where instability leaves permanent scars.'
}

apply from: rootProject.file('gradle/forge-module.gradle')

def obeliskGameTestNamespaces = (findProperty('obelisksGameTestNamespaces') ?: modId).toString()
def obeliskGameTestSelection = (findProperty('obelisksGameTestSelection') ?: 'all').toString()

gradle.projectsEvaluated {
    minecraft.runs.configureEach {
        property 'forge.enabledGameTestNamespaces', obeliskGameTestNamespaces
        property 'obelisks.gametest.selection', obeliskGameTestSelection
    }
}

tasks.register('runGameTestServerRunLifecycle', GradleBuild) {
    tasks = [':runGameTestServer']
    startParameter.projectProperties = ['obelisksGameTestSelection': 'run']
}

tasks.register('runGameTestServerActivation', GradleBuild) {
    tasks = [':runGameTestServer']
    startParameter.projectProperties = ['obelisksGameTestSelection': 'activation']
}

tasks.register('runGameTestServerRewards', GradleBuild) {
    tasks = [':runGameTestServer']
    startParameter.projectProperties = ['obelisksGameTestSelection': 'rewards']
}

tasks.register('runGameTestServerVoid', GradleBuild) {
    tasks = [':runGameTestServer']
    startParameter.projectProperties = ['obelisksGameTestSelection': 'void']
}

tasks.register('runGameTestServerData', GradleBuild) {
    tasks = [':runGameTestServer']
    startParameter.projectProperties = ['obelisksGameTestSelection': 'data']
}

tasks.register('runGameTestServerTemplate', GradleBuild) {
    tasks = [':runGameTestServer']
    startParameter.projectProperties = ['obelisksGameTestSelection': 'template']
}

tasks.register('runGameTestServerMultiplayer', GradleBuild) {
    tasks = [':runGameTestServer']
    startParameter.projectProperties = ['obelisksGameTestSelection': 'multiplayer']
}
