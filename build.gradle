plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
    id 'org.jetbrains.kotlin.jvm' version '1.9.24' apply false
}

ext {
    modId = 'dimensionalfonts'
    modName = 'Dimensional Fonts'
    modGroupId = 'dev.yourname.obelisks'
    modDescription = 'Dimensional blood fonts open real-dimension expeditions from small altars.'
}

apply from: rootProject.file('gradle/forge-module.gradle')

def dimensionalFontGameTestNamespaces = (findProperty('dimensionalFontsGameTestNamespaces') ?: modId).toString()
def dimensionalFontGameTestSelection = (findProperty('dimensionalFontsGameTestSelection') ?: 'all').toString()

gradle.projectsEvaluated {
    minecraft.runs.configureEach {
        property 'forge.enabledGameTestNamespaces', dimensionalFontGameTestNamespaces
        property 'dimensionalfonts.gametest.selection', dimensionalFontGameTestSelection
    }
}

def registerGameTestServerSelectionTask = { String taskName, String selection ->
    tasks.register(taskName, Exec) {
        workingDir rootProject.projectDir
        def gradleTask = ':runGameTestServer'
        def selectionProp = "-PdimensionalFontsGameTestSelection=${selection}"
        if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            commandLine 'cmd', '/c', 'gradlew.bat', '--no-daemon', gradleTask, selectionProp
        } else {
            commandLine './gradlew', '--no-daemon', gradleTask, selectionProp
        }
    }
}

registerGameTestServerSelectionTask('runGameTestServerRunLifecycle', 'run')
registerGameTestServerSelectionTask('runGameTestServerActivation', 'activation')
registerGameTestServerSelectionTask('runGameTestServerRewards', 'rewards')
registerGameTestServerSelectionTask('runGameTestServerVoid', 'void')
registerGameTestServerSelectionTask('runGameTestServerData', 'data')
registerGameTestServerSelectionTask('runGameTestServerTemplate', 'template')
registerGameTestServerSelectionTask('runGameTestServerMultiplayer', 'multiplayer')
registerGameTestServerSelectionTask('runGameTestServerCommands', 'commands')
registerGameTestServerSelectionTask('runGameTestServerRuntime', 'runtime')

tasks.register('verifyGameTests') {
    dependsOn(
        tasks.named('runGameTestServerRunLifecycle'),
        tasks.named('runGameTestServerActivation'),
        tasks.named('runGameTestServerRewards'),
        tasks.named('runGameTestServerVoid'),
        tasks.named('runGameTestServerData'),
        tasks.named('runGameTestServerTemplate'),
        tasks.named('runGameTestServerMultiplayer'),
        tasks.named('runGameTestServerCommands'),
        tasks.named('runGameTestServerRuntime')
    )
}

tasks.register('checkWithGameTests') {
    dependsOn(tasks.named('check'))
    dependsOn(tasks.named('verifyGameTests'))
}
